name: Verify GoDesk production

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public installer and protected creator routes
        shell: bash
        run: |
          set -euo pipefail

          origin="https://godesk.yumengfan220.workers.dev"
          installer="$(mktemp)"
          headers="$(mktemp)"

          curl --fail --silent --show-error \
            --dump-header "$headers" \
            --output "$installer" \
            "$origin/chatgpt-plugin"
          grep -q "Godesk" "$installer"
          grep -qi "^content-type: text/html" "$headers"

          asset_path="$(
            grep -oE '/assets/[^"[:space:]]+\.(js|css)' "$installer" |
              head -n 1
          )"
          test -n "$asset_path"
          curl --fail --silent --show-error \
            --output /dev/null \
            "$origin$asset_path"

          root_status="$(
            curl --silent --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              "$origin/"
          )"
          case "$root_status" in
            302|401|403) ;;
            *)
              echo "Expected Cloudflare Access on /, got HTTP $root_status" >&2
              exit 1
              ;;
          esac

          mcp_headers="$(mktemp)"
          mcp_status="$(
            curl --silent --show-error \
              --header "Accept: application/json" \
              --header "MCP-Protocol-Version: 2025-06-18" \
              --dump-header "$mcp_headers" \
              --output /dev/null \
              --write-out '%{http_code}' \
              "$origin/mcp"
          )"
          test "$mcp_status" = "401"
          grep -qi "^www-authenticate: Bearer" "$mcp_headers"
          grep -qi "resource_metadata=" "$mcp_headers"

          echo "Installer is public; creator routes require Access; MCP exposes OAuth discovery."
